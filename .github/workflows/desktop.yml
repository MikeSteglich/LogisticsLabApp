# Desktop builds of LogisticsLab Studio for Windows, Linux and macOS - each on its own system, because Flutter,
# Nuitka and CMPL build native code (dist/buildDist.py, dist/README.md).
#
#   started by hand (Actions -> Desktop builds -> Run workflow) or by a tag v*; a tag also makes a release
#   with the archives
#
# The three repositories lie side by side as dist/buildDist.py expects them:
#   LogisticsLabApp/  pyLogisticsLab/ (private)  Cmpl2/ (public)
# pyLogisticsLab and pyCmpl (installed by pip from GitHub) are private - the secret LOGLAB_REPOS_TOKEN is a
# fine-grained personal access token with read access ("Contents: Read-only") to these repositories.

name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write          # the release of a tag

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one system failing does not stop the others
      matrix:
        include:
          - name: Windows
            os: windows-latest
            extra: ''
          - name: Linux
            os: ubuntu-22.04
            extra: ''
          - name: macOS
            os: macos-14
            extra: --dmg
    defaults:
      run:
        shell: bash
    env:
      # macOS with a Developer ID: signed and notarized - without these secrets signed ad hoc
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARY_KEY != '' }}

    steps:
      - name: Check out LogisticsLabApp
        uses: actions/checkout@v4
        with:
          path: LogisticsLabApp

      - name: Check out pyLogisticsLab
        uses: actions/checkout@v4
        with:
          repository: MikeSteglich/pyLogisticsLab
          path: pyLogisticsLab
          token: ${{ secrets.LOGLAB_REPOS_TOKEN }}

      - name: Check out Cmpl2
        uses: actions/checkout@v4
        with:
          repository: MikeSteglich/Cmpl2
          path: Cmpl2

      # pip installs pyCmpl from its private repository (pyLogisticsLab/requirements.txt)
      - name: Access to the private repositories for git and pip
        run: git config --global url."https://x-access-token:${{ secrets.LOGLAB_REPOS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Python (base of the Nuitka build environment)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Linux - GTK and the compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev g++ make

      # CMPL is compiled with MinGW (Cmpl2/dist/README.md) - g++ and make of MSYS2 in the PATH
      - name: Windows - MSYS2 with MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
          path-type: inherit

      # diagnosis: solver processes have hung while loading DLLs - the virus scanner of the runner and the debugger
      # cdb (native stacks of a process that hangs, logisticsLabCore/jobs.py)
      - name: Windows - Defender and debugger
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, OnAccessProtectionEnabled | Format-List
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object FullName

      # the C files Nuitka has compiled - a new build compiles only what has changed; saved also after a failure
      - name: Nuitka cache - restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nuitka-${{ runner.os }}-

      # the certificate in a temporary keychain (the default keychain of this run), the API key of App Store Connect
      # for notarytool as the profile loglab-notary - removed at the end
      - name: macOS - certificate and notarization
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(openssl rand -base64 24)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
          security find-identity -v -p codesigning "$kc"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials loglab-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$kc"
          rm "$RUNNER_TEMP/notary.p8"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      # the computing core (Nuitka, CMPL, HiGHS) and the app - with the test of the core in the app; the app is not
      # started (no screen on the runners)
      # Windows: g++ of MinGW first in the PATH, the tools of MSYS2 (rm, sed for the makefile of CMPL) last - so that
      # they do not hide the tools of Visual Studio (link) for the build of the app
      - name: Build
        working-directory: LogisticsLabApp
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            msys=$(cygpath -u "$MSYS2_LOCATION")
            export PATH="$msys/mingw64/bin:$PATH:$msys/usr/bin"
          fi
          args=(--build-stdio --no-launch-test)
          # macOS with a Developer ID: signed, the .dmg notarized with the ticket stapled to it
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            args+=(--sign "$SIGN_IDENTITY" --notarize loglab-notary)
          fi
          python dist/buildDist.py "${args[@]}" ${{ matrix.extra }}

      - name: Nuitka cache - save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: macOS - remove the keychain
        if: always() && runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Archives
        uses: actions/upload-artifact@v4
        with:
          name: LogisticsLabStudio-${{ matrix.name }}
          path: LogisticsLabApp/dist/out/*
          if-no-files-found: error

      - name: Release of the tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LogisticsLabApp/dist/out/*
