# Desktop builds of LogisticsLab Studio for Windows, Linux and macOS (Apple silicon and Intel) - each on its own
# system, because Flutter, Nuitka and CMPL build native code (dist/buildDist.py, dist/README.md).
#
#   started by hand (Actions -> Desktop builds -> Run workflow) or by a tag v*; a tag also makes a release
#   with the archives
#
# The three repositories lie side by side as dist/buildDist.py expects them:
#   LogisticsLabApp/  pyLogisticsLab/  Cmpl2/ - all public, as pyCmpl (installed by pip from GitHub)

name: Desktop builds

on:
  # by hand: the systems to build chosen - each job costs Actions minutes (macOS ten times as many as Linux)
  workflow_dispatch:
    inputs:
      windows:
        description: Windows
        type: boolean
        default: true
      linux:
        description: Linux
        type: boolean
        default: true
      macos:
        description: macOS (Apple silicon)
        type: boolean
        default: true
      macos_intel:
        description: macOS (Intel)
        type: boolean
        default: true
  # a tag: all systems and a release
  push:
    tags: ['v*']

permissions:
  contents: write          # the release of a tag

jobs:
  # the systems of this run: those chosen by hand, all for a tag
  systems:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
    steps:
      - id: choose
        env:
          ALL: ${{ github.event_name != 'workflow_dispatch' }}
          WINDOWS: ${{ inputs.windows }}
          LINUX: ${{ inputs.linux }}
          MACOS: ${{ inputs.macos }}
          MACOS_INTEL: ${{ inputs.macos_intel }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          on = lambda k: os.environ['ALL'] == 'true' or os.environ[k] == 'true'
          systems = [
              ('WINDOWS', {'name': 'Windows', 'os': 'windows-latest', 'extra': '', 'file': '*.zip'}),
              ('LINUX', {'name': 'Linux', 'os': 'ubuntu-22.04', 'extra': '', 'file': '*.tar.gz'}),
              ('MACOS', {'name': 'macOS', 'os': 'macos-15', 'extra': '--dmg', 'file': '*.dmg'}),
              # Intel Macs (x86_64): the core built natively on an Intel runner - the app itself is universal anyway
              ('MACOS_INTEL', {'name': 'macOS-Intel', 'os': 'macos-15-intel', 'extra': '--dmg', 'file': '*.dmg'}),
          ]
          # file: the one archive of the system - uploaded as it is (no zip around it) and attached to a release
          print('matrix=' + json.dumps({'include': [s for k, s in systems if on(k)]}))
          PY

  build:
    name: ${{ matrix.name }}
    needs: systems
    if: ${{ fromJSON(needs.systems.outputs.matrix).include[0] != null }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one system failing does not stop the others
      matrix: ${{ fromJSON(needs.systems.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      # macOS with a Developer ID: signed and notarized - without these secrets signed ad hoc
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.NOTARY_KEY != '' }}

    steps:
      - name: Check out LogisticsLabApp
        uses: actions/checkout@v4
        with:
          path: LogisticsLabApp

      - name: Check out pyLogisticsLab
        uses: actions/checkout@v4
        with:
          repository: MikeSteglich/pyLogisticsLab
          path: pyLogisticsLab

      - name: Check out Cmpl2
        uses: actions/checkout@v4
        with:
          repository: MikeSteglich/Cmpl2
          path: Cmpl2

      - name: Python (base of the Nuitka build environment)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - name: Linux - GTK and the compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev g++ make

      # CMPL is compiled with MinGW-w64 (Cmpl2/dist/README.md) - g++ and make of MSYS2 in the PATH; UCRT64: against
      # the Universal C Runtime of Windows 10/11 (MINGW64 with msvcrt.dll is deprecated)
      - name: Windows - MSYS2 with MinGW
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc make
          path-type: inherit

      # the C files Nuitka has compiled - a new build compiles only what has changed; saved also after a failure; one
      # cache per system and architecture (the two macOS jobs)
      - name: Nuitka cache - restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nuitka-${{ runner.os }}-${{ runner.arch }}-

      # macOS: HiGHS built from its sources by Cmpl2/dist/buildDist.py (universal, macOS 14) - once, then from the
      # cache; the same for both macOS jobs, a new build when the build script changes (e.g. another version)
      - name: macOS - HiGHS cache
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: Cmpl2/dist/cache/highs-*-macos*-universal
          key: highs-macOS-${{ hashFiles('Cmpl2/dist/buildDist.py') }}

      # the certificate in a temporary keychain (the default keychain of this run), the API key of App Store Connect
      # for notarytool as the profile loglab-notary - removed at the end
      - name: macOS - certificate and notarization
        if: runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kp="$(openssl rand -base64 24)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$kc"
          security find-identity -v -p codesigning "$kc"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials loglab-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --keychain "$kc"
          rm "$RUNNER_TEMP/notary.p8"
          echo "SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      # the computing core (Nuitka, CMPL, HiGHS) and the app - with the test of the core in the app; the app is not
      # started (no screen on the runners)
      # Windows: g++ of MinGW first in the PATH, the tools of MSYS2 (rm, sed for the makefile of CMPL) last - so that
      # they do not hide the tools of Visual Studio (link) for the build of the app
      - name: Build
        working-directory: LogisticsLabApp
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            msys=$(cygpath -u "$MSYS2_LOCATION")
            export PATH="$msys/ucrt64/bin:$PATH:$msys/usr/bin"
          fi
          args=(--build-stdio --no-launch-test)
          # macOS with a Developer ID: signed, the .dmg notarized with the ticket stapled to it
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            args+=(--sign "$SIGN_IDENTITY" --notarize loglab-notary)
          fi
          python dist/buildDist.py "${args[@]}" ${{ matrix.extra }}

      # cmpl.exe is linked statically - no DLLs of MinGW (the tests do not show it: ucrt64/bin is in the PATH)
      - name: Windows - CMPL without DLLs of MinGW
        if: runner.os == 'Windows'
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          msys=$(cygpath -u "$MSYS2_LOCATION")
          dlls=$("$msys/ucrt64/bin/objdump" -p pyLogisticsLab/dist/build/windows-x86_64/logisticsLabStdio/bin/cmpl/bin/cmpl.exe | grep "DLL Name")
          echo "$dlls"
          if echo "$dlls" | grep -iE "libgcc|libstdc|libwinpthread|libgomp"; then
            echo "::error::cmpl.exe needs DLLs of MinGW"; exit 1
          fi

      - name: Nuitka cache - save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: macOS - remove the keychain
        if: always() && runner.os == 'macOS' && env.HAS_SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # the archive itself as the artifact of the run (archive: false - else GitHub zips it once more); its name is
      # that of the file
      - name: Archive
        uses: actions/upload-artifact@v7
        with:
          path: LogisticsLabApp/dist/out/${{ matrix.file }}
          archive: false
          if-no-files-found: error

      - name: Release of the tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LogisticsLabApp/dist/out/${{ matrix.file }}
